[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
 
[project]
name = "fairLLMs"
version = "0.1.0"
description = "Fairness definitions and bias metrics for large language models"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
 
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "torch>=2.0",
    "transformers>=4.38",
]
 
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
 
[tool.setuptools.packages.find]
where = ["."]
include = ["encoder_only*", "decoder_only*", "encoder_decoder*"]
