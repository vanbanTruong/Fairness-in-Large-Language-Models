    "fairLMs.definition.decoder_only.intrinsic_bias.attention_head_based_disparity",
    "fairLMs.definition.decoder_only.intrinsic_bias.stereotypical_association",
    "fairLMs.definition.decoder_only.intrinsic_bias.attention_head_based_disparity.nie",
    "fairLMs.definition.decoder_only.intrinsic_bias.attention_head_based_disparity.gbe",
    "fairLMs.definition.decoder_only.intrinsic_bias.stereotypical_association.sll",
    "fairLMs.definition.decoder_only.intrinsic_bias.stereotypical_association.ca",
    "fairLMs.definition.decoder_only.intrinsic_bias.stereotypical_association.sll.data",
    "fairLMs.definition.decoder_only.intrinsic_bias.stereotypical_association.ca.data",
    "fairLMs.mitigation.intraprocessing",
    "fairLMs.mitigation.inprocessing",
    "fairLMs.mitigation.postprocessing",
    "fairLMs.mitigation.preprocessing",
    "fairLMs.data.crows_pairs",
    "fairLMs.data.bbq",
]

[tool.setuptools.dynamic]
version = { attr = "fairLMs._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# `fairLMs/definition/` holds 33 `main.py` and 25 `stimuli.py` files in sibling
# directories. Under the default "prepend" import mode pytest names a module by
# its basename, so collecting the package -- `pytest --doctest-modules fairLMs/`
# -- aborts with 56 "import file mismatch" errors and every doctest in the
# library goes unrun. importlib mode derives the module name from the full path
# instead, so the duplicate basenames stop colliding.
addopts = ["--import-mode=importlib"]
filterwarnings = [
    # Surface accidental use of the deprecated keyword API inside the library
    # itself; tests that exercise it opt in with pytest.warns.
    "ignore::DeprecationWarning:importlib._bootstrap",
]

[tool.black]
target-version = ["py310"]

[tool.setuptools.package-data]
# fairLMs/data/ has an __init__.py (it exports the bundled WEAT/SEAT word sets),
# so it is a package in its own right and owns these files. Keyed on
# `fairLMs.data` for that reason. The older `fairLMs = ["data/bbq/*.jsonl"]`
# form still resolves on setuptools>=77, so this is correctness, not a fix.
"fairLMs.data" = [
    "README.md",
    "NOTICE.md",
    "checksums.json",
    "crows_pairs/*.csv",
    "bbq/*.jsonl",
]
